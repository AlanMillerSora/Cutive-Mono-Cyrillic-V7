<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Cutive Mono Cyrillic — optional font preference.
  Install to ~/.config/fontconfig/conf.d/ and run `fc-cache -f`.
  Remove the file (and run fc-cache -f) to disable.

  Note: if you already have ~/.config/fontconfig/fonts.conf, fontconfig
  may not read conf.d/ automatically. In that case add this line inside
  the <fontconfig> element of fonts.conf:

      <include ignore_missing="yes">conf.d</include>
-->
<fontconfig>
  <!-- Cyrillic + Latin text: this fork first, generic monospace after it. -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>Cutive Mono Cyrillic</family>
    </prefer>
  </alias>

  <!-- Keep a real Nerd Font symbol font as the icon fallback, after the
       text font, so icons and Cyrillic can share one line. -->
  <alias binding="weak">
    <family>monospace</family>
    <default>
      <family>Symbols Nerd Font</family>
      <family>Symbols Nerd Font Mono</family>
    </default>
  </alias>

  <!-- Slightly firmer hinting for small sizes, matching grayscale AA. -->
  <match target="font">
    <test name="family"><string>Cutive Mono Cyrillic</string></test>
    <test name="pixelsize" compare="less_eq"><double>16</double></test>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
